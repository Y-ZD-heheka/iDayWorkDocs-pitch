<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-container {
  background: rgba(255,255,255,0.95);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.logo {
  text-align: center;
  margin-bottom: 30px;
}
.logo h1 {
  color: #1a1a2e;
  font-size: 2em;
  font-weight: 800;
  letter-spacing: 2px;
}
.logo p {
  color: #666;
  font-size: 0.9em;
  margin-top: 8px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  color: #333;
  font-size: 0.85em;
  font-weight: 600;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1em;
  transition: border-color 0.3s;
  outline: none;
}
.form-group input:focus {
  border-color: #1a73e8;
}
.btn-login {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #1a73e8, #4fc3f7);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(26,115,232,0.4);
}
.btn-login:active {
  transform: translateY(0);
}
.error-msg {
  color: #e53935;
  font-size: 0.85em;
  text-align: center;
  margin-top: 16px;
  min-height: 20px;
}
.security-note {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #eee;
}
.security-note p {
  color: #999;
  font-size: 0.75em;
  line-height: 1.6;
}
</style>

// 十六进制转 ArrayBuffer
function hexToBuffer(hex) {
  const bytes = new Uint8Array(hex.length / 2);
  for (let i = 0; i < hex.length; i += 2) {
    bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
  }
  return bytes.buffer;
}

// Base64 转 ArrayBuffer
function base64ToBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

// ArrayBuffer 转 Base64
function bufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) {
    binary += String.fromCharCode(bytes[i]);
  }
  return btoa(binary);
}

// PBKDF2 派生密钥
async function deriveKey(password, salt) {
  const encoder = new TextEncoder();
  const passwordBuffer = encoder.encode(password);
  
  // 导入密码
  const passwordKey = await crypto.subtle.importKey(
    'raw',
    passwordBuffer,
    'PBKDF2',
    false,
    ['deriveBits', 'deriveKey']
  );
  
  // 派生 AES-GCM 密钥
  return crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: salt,
      iterations: 100000,
      hash: 'SHA-512'
    },
    passwordKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

// 解密内容
async function decrypt(encryptedBase64, key, iv, authTag) {
  const encryptedBuffer = base64ToBuffer(encryptedBase64);
  const ivBuffer = hexToBuffer(iv);
  const authTagBuffer = hexToBuffer(authTag);
  
  // 将 authTag 附加到密文末尾（Web Crypto API 要求）
  const combined = new Uint8Array(encryptedBuffer.byteLength + authTagBuffer.byteLength);
  combined.set(new Uint8Array(encryptedBuffer), 0);
  combined.set(new Uint8Array(authTagBuffer), encryptedBuffer.byteLength);
  
  try {
    const decrypted = await crypto.subtle.decrypt(
      {
        name: 'AES-GCM',
        iv: ivBuffer,
        tagLength: 128
      },
      key,
      combined.buffer
    );
    
    const decoder = new TextDecoder();
    return decoder.decode(decrypted);
  } catch (e) {
    throw new Error('解密失败：密码错误或数据损坏');
  }
}

// SHA-256 哈希
async function sha256(message) {
  const encoder = new TextEncoder();
  const data = encoder.encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  const hashArray = Array.from(new Uint8Array(hashBuffer));
  return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
}

// 处理登录
async function handleLogin(event) {
  event.preventDefault();
  
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';
  
  if (!password) {
    errorMsg.textContent = '请输入密码';
    return false;
  }
  
  try {
    // 验证密码哈希
    const salt = CONFIG.salt;
    const passwordHash = await sha256(password + salt);
    
    if (passwordHash !== CONFIG.passwordHash) {
      errorMsg.textContent = '密码错误，请重试';
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
      return false;
    }
    
    // 解密内容
    const saltBuffer = hexToBuffer(salt);
    const key = await deriveKey(password, saltBuffer);
    const html = await decrypt(CONFIG.encrypted, key, CONFIG.iv, CONFIG.authTag);
    
    // 存储会话
    sessionStorage.setItem('authenticated', 'true');
    sessionStorage.setItem('authTime', Date.now().toString());
    
    // 显示解密后的内容
    document.open();
    document.write(html);
    document.close();
    
  } catch (e) {
    errorMsg.textContent = '认证失败：' + e.message;
    console.error('Auth error:', e);
  }
  
  return false;
}

// 检查会话
function checkSession() {
  const authenticated = sessionStorage.getItem('authenticated');
  const authTime = sessionStorage.getItem('authTime');
  
  if (authenticated && authTime) {
    // 会话有效期：2小时
    const sessionDuration = 2 * 60 * 60 * 1000;
    const elapsed = Date.now() - parseInt(authTime);
    
    if (elapsed < sessionDuration) {
      // 会话有效，提示用户
      document.getElementById('errorMsg').textContent = '检测到有效会话，请重新输入密码刷新';
      document.getElementById('errorMsg').style.color = '#1a73e8';
    }
  }
}

// 防调试检测
(function() {
  // 检测开发者工具
  const devToolsThreshold = 160;
  const widthThreshold = window.outerWidth - window.innerWidth > devToolsThreshold;
  const heightThreshold = window.outerHeight - window.innerHeight > devToolsThreshold;
  
  if (widthThreshold || heightThreshold) {
    console.warn('检测到开发者工具已打开');
  }
  
  // 禁用右键菜单
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });
  
  // 禁用部分快捷键
  document.addEventListener('keydown', function(e) {
    // F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
    if (e.key === 'F12' || 
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'u')) {
      e.preventDefault();
      return false;
    }
  });
})();

// 页面加载时检查会话
window.addEventListener('load', checkSession);

// 自动聚焦密码输入框
window.addEventListener('load', function() {
  document.getElementById('password').focus();
});
